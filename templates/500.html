<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erro Interno</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="flex min-h-screen flex-col items-center justify-center px-4 text-center">
        <span class="rounded-full bg-red-100 px-3 py-1 text-xs font-bold uppercase tracking-wider text-red-700">
            Erro 500
        </span>
        <h1 class="mt-4 text-2xl font-bold sm:text-4xl">Erro interno no servidor</h1>
        <p class="mt-2 max-w-md text-sm text-slate-600 sm:text-base">
            Ocorreu uma falha inesperada ao processar sua solicitação. Tente novamente em alguns instantes.
        </p>
        <div class="mt-6">
            <a href="/" class="inline-flex items-center justify-center rounded-md bg-[#FFFE03] px-5 py-2 text-sm font-medium text-black shadow hover:font-bold">
                Voltar ao Início
            </a>
        </div>
    </div>
</body>
</html>
